org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
kotlin.code.style=official

# daemon criteria 需要 JDK21。工具链默认按 gradle/gradle-daemon-jvm.properties 自动下载
# （经 foojay 跳转，需能访问外网）。本机已有 JDK21 时，在本机 GRADLE_USER_HOME 下的
# gradle.properties 里加 org.gradle.java.installations.paths=<JDK21 目录> 可跳过下载。

# 构建提速：本工程无动态配置逻辑，可安全启用配置缓存
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
